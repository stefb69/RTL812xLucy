name: Build kext

permissions:
  contents: write

on:
  push:
    branches: [rtl8127, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Build (Release, universal x86_64 + arm64e)
        run: |
          set -o pipefail
          xcodebuild -project RTL812xLucy.xcodeproj \
                     -target RTL812xLucy \
                     -configuration Release \
                     build \
                     CODE_SIGNING_ALLOWED=NO \
                     RUN_CLANG_STATIC_ANALYZER=NO | tail -40

      - name: Verify architectures
        run: |
          lipo -archs build/Release/RTL812xLucy.kext/Contents/MacOS/RTL812xLucy
          lipo -archs build/Release/RTL812xLucy.kext/Contents/MacOS/RTL812xLucy | grep -q arm64e

      - name: Build dext skeleton (RTL8127Dext)
        run: |
          set -o pipefail
          xcodebuild -project RTL8127Dext/RTL8127Dext.xcodeproj \
                     -target RTL8127Dext \
                     -configuration Release \
                     build \
                     CODE_SIGNING_ALLOWED=NO | tail -15

      - name: Package
        run: |
          cd build/Release
          zip -ry RTL812xLucy-${{ github.ref_name }}-${{ github.sha }}.kext.zip RTL812xLucy.kext RTL812xLucy.kext.dSYM

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTL812xLucy.kext
          path: build/Release/*.kext.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/*.kext.zip
          generate_release_notes: true
          body: |
            Unsigned development build of the RTL812xLucy kext with RTL8127/RTL8127ATF support.

            Loading on Apple Silicon requires Reduced Security with user kext
            management enabled, plus `csrutil disable` while the kext is unsigned.
            See the README for instructions.
