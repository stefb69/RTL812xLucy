name: Build kext + dext (CI check)

permissions:
  contents: write

on:
  push:
    branches: [rtl8127, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
          xcrun --sdk driverkit --show-sdk-path

      # ---- kext (RTL812xLucy) ----
      - name: Build kext (Release, universal x86_64 + arm64e)
        run: |
          set -o pipefail
          xcodebuild -project RTL812xLucy.xcodeproj \
                     -target RTL812xLucy \
                     -configuration Release \
                     build \
                     CODE_SIGNING_ALLOWED=NO \
                     RUN_CLANG_STATIC_ANALYZER=NO | tail -40

      - name: Verify kext architectures
        run: |
          BIN=build/Release/RTL812xLucy.kext/Contents/MacOS/RTL812xLucy
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -q arm64e
          lipo -archs "$BIN" | grep -q x86_64

      # ---- dext + host app (RTL8127Dext / RTL8127App) ----
      # Building the app target also builds the dext (a target dependency)
      # and embeds it under Contents/Library/SystemExtensions.
      - name: Build dext + host app (Release, universal x86_64 + arm64)
        run: |
          set -o pipefail
          xcodebuild -project RTL8127Dext/RTL8127Dext.xcodeproj \
                     -target RTL8127App \
                     -configuration Release \
                     build \
                     CODE_SIGNING_ALLOWED=NO \
                     RUN_CLANG_STATIC_ANALYZER=NO | tail -40

      - name: Verify dext architectures
        run: |
          BIN=RTL8127Dext/build/Release-driverkit/net.wizzz.RTL8127Dext.dext/net.wizzz.RTL8127Dext
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -q arm64
          lipo -archs "$BIN" | grep -q x86_64

      # ---- package ----
      - name: Package
        run: |
          mkdir -p dist
          STAMP="${{ github.ref_name }}-${{ github.sha }}"
          ( cd build/Release && \
            zip -ry "$GITHUB_WORKSPACE/dist/RTL812xLucy-$STAMP.kext.zip" \
                RTL812xLucy.kext RTL812xLucy.kext.dSYM )
          ( cd RTL8127Dext/build/Release && \
            zip -ry "$GITHUB_WORKSPACE/dist/RTL8127App-$STAMP.app.zip" \
                RTL8127App.app )
          ( cd RTL8127Dext/build/Release-driverkit && \
            zip -ry "$GITHUB_WORKSPACE/dist/RTL8127Dext-$STAMP.dext.zip" \
                net.wizzz.RTL8127Dext.dext net.wizzz.RTL8127Dext.dext.dSYM )
          # installer package (unsigned; lights up signing when
          # DEVELOPER_ID_INSTALLER is set, see packaging/build-pkg.sh)
          PKG_VERSION="${{ github.ref_name }}"
          case "$PKG_VERSION" in v*) PKG_VERSION="${PKG_VERSION#v}" ;; *) PKG_VERSION="0.1.0" ;; esac
          packaging/build-pkg.sh \
              RTL8127Dext/build/Release/RTL8127App.app \
              "$PKG_VERSION" \
              "dist/RTL8127-$STAMP.pkg"
          ls -lh dist

      - name: Upload kext artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTL812xLucy-kext
          path: dist/*.kext.zip

      - name: Upload dext artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTL8127Dext
          path: |
            dist/*.app.zip
            dist/*.dext.zip

      - name: Upload installer package
        uses: actions/upload-artifact@v4
        with:
          name: RTL8127-installer
          path: dist/*.pkg

      # Tagged releases are published by hand with the notarized installer
      # (packaging/sign-and-notarize.sh); CI cannot sign, and the unsigned
      # kext is no longer shipped. The artifacts above stay available for
      # every build.
