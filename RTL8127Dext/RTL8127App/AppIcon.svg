<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <!-- full-bleed: the system applies its own squircle mask and glass -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#gloss)"/>
  <g stroke="#ffffff" stroke-width="34" stroke-linecap="round" fill="none" opacity="0.95">
    <line x1="512" y1="470" x2="312" y2="280"/>
    <line x1="512" y1="470" x2="712" y2="280"/>
    <line x1="512" y1="470" x2="512" y2="236"/>
  </g>
  <g fill="#ffffff">
    <circle cx="512" cy="470" r="64"/>
    <circle cx="312" cy="280" r="46"/>
    <circle cx="712" cy="280" r="46"/>
    <circle cx="512" cy="236" r="46"/>
  </g>
  <rect x="382" y="548" width="260" height="66" rx="16" fill="#ffffff" opacity="0.95"/>
  <rect x="408" y="566" width="208" height="30" rx="7" fill="#0e7490" opacity="0.9"/>
  <text x="512" y="820" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="230" fill="#ffffff" letter-spacing="-8">10G</text>
</svg>
